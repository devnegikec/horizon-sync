server {
    # $PORT is injected by Railway; the nginx image's envsubst fills this in.
    # PORT defaults to 80 via `ENV PORT=80` in Dockerfile.railway.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # SPA entry points must never be cached
    location ~* (?:remoteEntry\.js|\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # inventory (module-federation remote) — MUST stay on this origin, because
    # apps/platform/webpack.config.prod.ts pins the remote to the relative URL
    # '/inventory/remoteEntry.js'.
    location ^~ /inventory/ {
        try_files $uri $uri/ /inventory/index.html;

        location = /inventory/remoteEntry.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # admin (standalone SPA, built with publicPath 'auto' so a subpath works)
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # platform (host app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
