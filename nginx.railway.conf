server {
    # Hardcoded on purpose. Railway injects its own PORT at runtime, and the
    # nginx entrypoint's envsubst would bind us to THAT port, while the Railway
    # domain target port is configured as 80 -> every request 502s.
    # Listening on a fixed 80 keeps the container port and the domain target in
    # sync (the domain is created with `railway domain --port 80`).
    listen 80;

    # app.ciphercode.ai is the intended public host. `_` keeps this as the
    # DEFAULT server, so the Railway-generated domain (and any other hostname
    # pointing here) keeps working unchanged.
    server_name app.ciphercode.ai _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # SPA entry points must never be cached
    location ~* (?:remoteEntry\.js|\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The platform host owns the "/inventory" route (AppRoutes.tsx mounts the
    # inventory remote at exactly "/inventory").
    #
    # Both exact paths are handled explicitly, because the remote's files live in
    # a REAL directory (/usr/share/nginx/html/inventory): nginx would otherwise
    # auto-301 "/inventory" -> "/inventory/", which combined with a redirect back
    # creates an infinite loop. Serving the platform shell directly avoids that.
    #
    # Only real static files (remoteEntry.js + the remote's chunks) come from the
    # inventory build; everything else under /inventory/ is a platform SPA route
    # and must fall back to the PLATFORM shell. Serving the remote's own
    # index.html here would break, because it is built with baseHref "/" and so
    # requests its assets from the site root, which 404s.
    location = /inventory  {
        try_files /index.html =404;
    }

    location = /inventory/ {
        try_files /index.html =404;
    }

    location ^~ /inventory/ {
        try_files $uri /index.html;
    }

    # admin (standalone SPA, built with publicPath 'auto' so a subpath works)
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # platform (host app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ---------------------------------------------------------------------------
# admin.ciphercode.ai
#
# The admin app is a STANDALONE SPA (no module federation), so on its own host
# it is served from the root. It is built with baseHref "/" and publicPath
# "auto", so serving it at the root of a separate hostname is correct.
#
# It is also still reachable at app.ciphercode.ai/admin/ from the block above.
# Both custom domains are attached to this same Railway service, and nginx
# picks the block by Host header.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.ciphercode.ai;

    root /usr/share/nginx/html/admin;
    index index.html;
    client_max_body_size 25m;

    location ~* (?:remoteEntry\.js|\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
