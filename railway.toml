# Railway config-as-code for the UI service (horizon-ui) in BW-staging/staging.
#
# Serves all three UIs from one nginx container. The image is built from source
# by Dockerfile.railway — NOT by the root Dockerfile, which belongs to the ECS
# pipeline and expects a prebuilt dist/.
#
# API URLs are baked in at build time from the service variables
# NX_API_BASE_URL / NX_API_CORE_URL / NX_API_IDENTITY_URL.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.railway"

[deploy]
healthcheckPath = "/healthz"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
