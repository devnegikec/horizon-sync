name: Deploy UI to Railway (Dev)

# Builds and deploys the single nginx image that serves all three UIs
# (platform at /, inventory at /inventory/, admin at /admin/) to the
# `dev` environment of the BW-2.0 project (fd8e8c06-a0a1-4592-9d6e-9a63c6cfb090),
# which is a replica of `staging` and deploys from this `dev` branch.
#
# The actual `nx build` happens INSIDE the Railway Docker build (multi-stage),
# so CI only uploads source — no Node build runs in Actions.
#
# Trigger: ANY push/merge to `dev`.
# Requires repo secret: RAILWAY_TOKEN_DEV
#   (a project token for BW-2.0 scoped to its `dev` environment)
#
# The API URLs the UI calls are baked in at image-build time from the service
# variables NX_API_BASE_URL / NX_API_CORE_URL / NX_API_IDENTITY_URL, so changing
# a domain requires a rebuild — this workflow does that.
#
# NOTE: never export a variable called RAILWAY_ENV here (see the backend workflow).

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: railway-dev-ui
  cancel-in-progress: false

env:
  RW_PROJECT_ID: fd8e8c06-a0a1-4592-9d6e-9a63c6cfb090
  RW_ENVIRONMENT: dev
  RW_SERVICE: horizon-ui

jobs:
  deploy:
    name: Deploy horizon-ui
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy horizon-ui
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
        run: |
          railway up \
            -p "$RW_PROJECT_ID" -e "$RW_ENVIRONMENT" -s "$RW_SERVICE" \
            -m "dev: ${GITHUB_SHA::7} (horizon-ui)" -d

      - name: Verify deployment reached SUCCESS
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
        run: |
          set -uo pipefail
          ok=0
          for i in $(seq 1 60); do
            status=$(railway deployment list \
              -p "$RW_PROJECT_ID" -e "$RW_ENVIRONMENT" -s "$RW_SERVICE" --json 2>/dev/null \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print((d[0] if isinstance(d,list) and d else {}).get('status',''))" \
              2>/dev/null || echo "")
            echo "attempt $i/60: ${status:-<no status>}"
            case "$status" in
              SUCCESS) ok=1; break ;;
              FAILED|CRASHED|REMOVED) echo "::error::deployment is $status"; break ;;
            esac
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::$RW_SERVICE did not reach SUCCESS"
            exit 1
          fi
          echo "✅ horizon-ui deployed successfully"

      - name: Smoke test public entry points
        continue-on-error: true
        run: |
          for url in https://horizon-ui-dev.up.railway.app/ https://horizon-ui-dev.up.railway.app/healthz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "$url -> $code"
          done

      - name: Dump deploy logs on failure
        if: failure()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
        run: |
          railway logs -p "$RW_PROJECT_ID" -e "$RW_ENVIRONMENT" -s "$RW_SERVICE" -b -n 80 || true
          railway logs -p "$RW_PROJECT_ID" -e "$RW_ENVIRONMENT" -s "$RW_SERVICE" -d -n 80 || true
