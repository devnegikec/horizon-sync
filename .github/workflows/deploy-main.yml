name: Deploy to Staging (ECS)

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPO: 287566806648.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER: staging-horizon-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all apps
        run: npx nx run-many -t build -p platform inventory admin --configuration=production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        run: |
          docker build -t $ECR_REPO/horizon-frontend:${{ github.sha }} .
          docker tag $ECR_REPO/horizon-frontend:${{ github.sha }} $ECR_REPO/horizon-frontend:latest
          docker push $ECR_REPO/horizon-frontend:${{ github.sha }}
          docker push $ECR_REPO/horizon-frontend:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $CLUSTER \
            --service horizon-frontend-service \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Notify success
        if: success()
        run: echo "✅ Deployed ${{ github.sha }} to staging"
